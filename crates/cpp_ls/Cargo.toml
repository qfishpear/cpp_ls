[package]
name = "cpp_ls"
version = "0.5.0"
edition = "2024"
description = "A C, C++ and CUDA language server."
license = "MIT"
authors = ["CppCXY"]
repository = "https://github.com/CppCXY/cpp_ls"
readme = "README.md"
keywords = ["cpp", "language-server"]
categories = ["development-tools"]

[dependencies]
# The engine: the parser and the analysis layer are the two crates this server exists to serve.
cpp_parser.workspace = true
# The formatter: `textDocument/formatting` is this server handing the file to `cpp_formatter` and diffing the result.
cpp_formatter.workspace = true
cpp_code_analysis.workspace = true


lsp-server.workspace = true
lsp_types.workspace = true
serde.workspace = true
serde_json.workspace = true

# The runtime. `tokio` because every handler is async, the update queue is a task and the indexing pump is another;
# `tokio-util` for the `CancellationToken` every request carries. Features are target-specific below: the wasm
# build has no threads, processes or sockets.
tokio-util.workspace = true
async-task.workspace = true

# The two vocabularies a reader hovers over -- C++'s keywords and Doxygen's commands -- are text, not logic: they
# live in `locales/en.yml` and are embedded at build time by `rust_i18n::i18n!`. The same crate carries the
# parser's own messages, so a translation is a second YAML file and not a second code path.
rust-i18n.workspace = true
percent-encoding.workspace = true
# Logging: `log` for the calls, `fern` for the sink, `chrono` for the timestamp in the file name.
log.workspace = true
fern.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }

# wasm has no inotify and no mimalloc. The browser client pushes file changes itself, and that build uses the
# system allocator.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net", "process", "signal", "fs"] }
notify.workspace = true
mimalloc-safe = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["macros", "sync"] }

[[bin]]
name = "cpp_ls"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:mimalloc-safe"]

[dev-dependencies]
cpp_code_analysis = { workspace = true, features = ["test-support"] }
