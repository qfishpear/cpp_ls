[package]
name = "cpp_code_analysis"
version = "0.5.0"
edition = "2024"
description = "The analysis layer of cpp_ls: the preprocessor, symbol scopes, type inference and the semantic checks."
license = "MIT"
authors = ["CppCXY"]
repository = "https://github.com/CppCXY/cpp_ls"
readme = "README.md"
keywords = ["cpp", "language-server"]
categories = ["development-tools"]

[dependencies]
cpp_parser.workspace = true
cpp_toolchain.workspace = true
cpp_formatter.workspace = true


log.workspace = true
glob.workspace = true
rust-i18n.workspace = true
redb.workspace = true
rustc-hash.workspace = true
# **A summary's text is an identifier, not a document.** `SmolStr` keeps up to 22 bytes inline, so a declaration's name
# costs no allocation at all — and a `FileSummary` is made of them: 486 783 declarations over 1 761 files on
# `EmmyLuaCodeStyle`, 517 bytes each (measured by a probe that has since been removed with the other probes). The
# `serde` feature is on because a name ends up in an LSP payload (`typeHierarchyItem.data`), and converting at each
# site is what the type should not need.
smol_str.workspace = true

# zstd-sys compiles C. wasm32-wasip1 has no wasi-sdk here, so the wasm build stores cache rows uncompressed.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd.workspace = true

[features]
# **Test-only knobs a dependent crate's tests call.** Off for every build that is not itself a test of this crate,
# unless that dependent opts in. `pretend_a_pause` is the one knob: it moves the editing clock without sleeping.
test-support = []
